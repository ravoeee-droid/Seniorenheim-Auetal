<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350" role="img" aria-labelledby="title desc">
  <title id="title">Auetal Recruiting Creative 01 – Wiedererkennung</title>
  <desc id="desc">Recruiting-Motiv des Seniorenheims Auetal mit echtem Auetal-Teamfoto und der Botschaft Du bist nicht müde von der Pflege.</desc>
  <defs>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10090b" stop-opacity="0.12"/>
      <stop offset="0.38" stop-color="#10090b" stop-opacity="0.24"/>
      <stop offset="0.68" stop-color="#160a0e" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#160a0e" stop-opacity="0.98"/>
    </linearGradient>
    <linearGradient id="wine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a2a36"/>
      <stop offset="1" stop-color="#9b3c4c"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#0a0507" flood-opacity="0.30"/>
    </filter>
    <clipPath id="frame"><rect width="1080" height="1350" rx="54"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1080" height="1350" fill="#211014"/>
    <image href="https://seniorenheim-auetal.de/wp-content/uploads/2018/11/ausbildung_img.png" x="0" y="0" width="1080" height="1350" preserveAspectRatio="xMidYMid slice"/>
    <rect width="1080" height="1350" fill="url(#shade)"/>

    <path d="M-90 1085 C195 940 366 1010 533 1113 C720 1228 880 1215 1170 1050 L1170 1420 L-90 1420Z" fill="#160a0e" opacity="0.94"/>
    <path d="M-60 1120 C200 997 385 1057 535 1147" fill="none" stroke="#e3a5ad" stroke-width="3" opacity="0.36"/>

    <g transform="translate(68 64)">
      <circle cx="31" cy="31" r="30" fill="none" stroke="#fff" stroke-width="2" opacity="0.95"/>
      <path d="M18 43 31 15l13 28M23 34h16" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="78" y="22" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" letter-spacing="1">SENIORENHEIM</text>
      <text x="78" y="53" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="900" letter-spacing="0.5">AUETAL</text>
    </g>

    <g transform="translate(920 66)">
      <circle cx="46" cy="46" r="46" fill="#fff"/>
      <text x="46" y="55" text-anchor="middle" fill="#7a2a36" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="900">01</text>
    </g>

    <g transform="translate(68 714)">
      <rect width="252" height="54" rx="27" fill="url(#wine)" filter="url(#shadow)"/>
      <text x="126" y="35" text-anchor="middle" fill="#fff" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="900" letter-spacing="1.8">WIEDERERKENNUNG</text>
    </g>

    <g transform="translate(68 806)">
      <text fill="#fff" font-family="Georgia, 'Times New Roman', serif" font-size="79" font-weight="400" letter-spacing="-2.3">
        <tspan x="0" y="0">Du bist nicht müde</tspan>
        <tspan x="0" y="86">von der Pflege.</tspan>
      </text>
      <text fill="#f9eef0" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="500">
        <tspan x="0" y="218">Vielleicht nur von einem Alltag, in dem für das</tspan>
        <tspan x="0" y="258">Menschliche zu wenig Raum bleibt.</tspan>
      </text>
    </g>

    <g transform="translate(68 1138)" filter="url(#shadow)">
      <rect width="342" height="78" rx="39" fill="#fff"/>
      <text x="36" y="49" fill="#7a2a36" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="900">Auetal kennenlernen</text>
      <text x="296" y="49" fill="#7a2a36" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="900">→</text>
    </g>

    <text x="68" y="1291" fill="#fff" opacity="0.70" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="2.4">KARRIERE · ECHTE EINBLICKE · KALEFELD-ECHTE</text>
  </g>
</svg>
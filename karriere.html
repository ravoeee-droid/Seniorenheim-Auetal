<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Karriere · Seniorenheim Auetal</title>
<style>html,body{margin:0;background:#17211b;color:#fff;font-family:system-ui,sans-serif;min-height:100%}.loading{min-height:100svh;display:grid;place-items:center;text-align:center;padding:24px}.loading b{font-size:18px}.loading span{opacity:.65;font-size:12px}</style>
</head>
<body>
<div class="loading"><div><b>Auetal Karrierewelt</b><br><span>wird geladen …</span></div></div>
<script>
Promise.all([
  'parts/karriere-1.html',
  'parts/karriere-2.html',
  'parts/karriere-3.html',
  'parts/karriere-4.html'
].map(u=>fetch(u).then(r=>{if(!r.ok)throw new Error(u);return r.text()})))
.then(parts=>{document.open();document.write(parts.join(''));document.close()})
.catch(()=>{document.body.innerHTML='<div class="loading"><div><b>Karrierewelt konnte nicht geladen werden.</b><br><span>Bitte Seite neu laden.</span></div></div>'});
</script>
</body>
</html>

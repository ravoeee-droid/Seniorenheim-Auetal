<style>
.loading{display:none!important}
.nojs-career{box-sizing:border-box;min-height:100svh;background:#faf6ef;color:#242b25;font-family:system-ui,sans-serif;padding:clamp(24px,7vw,78px);line-height:1.65}

<main class="nojs-career" id="main">
  <p><strong>Seniorenheim Auetal · Karriere</strong></p>
  <h1>Pflegefachkräfte gesucht – wir freuen uns auf dich.</h1>
  <p>Die interaktive Karrierewelt benötigt JavaScript. Du kannst uns aber auch ohne JavaScript kennenlernen und dich jederzeit unverbindlich melden.</p>
  <p>Auetal ist ein familiengeführtes Seniorenheim in Kalefeld-Echte – mit eigener Kinderkrippe und der Möglichkeit, unseren Arbeitsalltag bei einer Hospitation kennenzulernen.</p>
  <h2>Offene Bereiche</h2>
  <ul><li>Examinierte Pflegefachkräfte im Haus Clausberg – Tag- oder Nachtdienst</li><li>Examinierte Pflegefachkräfte im Haus Herrenwiese – Tagdienst</li><li>Weitere Tätigkeiten in Pflege und Betreuung</li></ul>
  <div class="nojs-contact">
    <a href="tel:+49555399430">05553 / 9943-0 anrufen</a>
    <a href="mailto:info@seniorenheim-auetal.de?subject=Unverbindliches%20Kennenlernen%20Auetal">E-Mail an Auetal schreiben</a>
  </div>
  <p><a href="https://seniorenheim-auetal.de/jobs/">Weitere Stellenangebote</a> · <a href="https://seniorenheim-auetal.de/datenschutz/">Datenschutz</a> · <a href="https://seniorenheim-auetal.de/impressum/">Impressum</a></p>

<script>
Promise.all([
  'parts/karriere-1.html',
  'parts/karriere-2.html',
  'parts/karriere-3.html',
  'parts/karriere-4.html'
].map(u=>fetch(u).then(r=>{if(!r.ok)throw new Error(u);return r.text()})))
.then(parts=>{document.open();document.write(parts.join(''));document.close()})
.catch(()=>{document.body.innerHTML='<div class="loading"><div><b>Karrierewelt konnte nicht geladen werden.</b><br><span>Bitte Seite neu laden.</span></div></div>'});
